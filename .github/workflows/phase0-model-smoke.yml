name: phase0-model-smoke

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/phase0-model-smoke.yml
      - runtime/cpu/benchmark.py
      - runtime/cpu/serve.py
      - runtime/cpu/smoke_api.py
      - runtime/cpu/requirements.txt
      - scripts/serve_openai_api.py
  workflow_dispatch:

jobs:
  model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r runtime/cpu/requirements.txt
      - name: Run CPU benchmark
        run: |
          mkdir -p benchmarks/cpu
          python runtime/cpu/benchmark.py \
            --model jingyaogong/minimind-3 \
            --threads 2 \
            --max-new-tokens 8 \
            --output benchmarks/cpu/github-actions.json
      - name: Start CPU API
        run: |
          python runtime/cpu/serve.py \
            --model jingyaogong/minimind-3 \
            --threads 2 \
            > /tmp/rocksoul-server.log 2>&1 &
          echo $! > /tmp/rocksoul-server.pid
      - name: Wait for API and smoke test
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8998/docs >/dev/null; then
              python runtime/cpu/smoke_api.py
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rocksoul-server.log
          exit 1
      - name: Collect logs
        if: always()
        run: |
          mkdir -p benchmarks/cpu
          if [ -f /tmp/rocksoul-server.log ]; then
            cp /tmp/rocksoul-server.log benchmarks/cpu/rocksoul-server.log
          fi
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-cpu-benchmark
          path: benchmarks/cpu/
          if-no-files-found: warn
