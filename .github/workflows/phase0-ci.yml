name: rocksoul-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile RockSoul runtime and Phase 1
        run: |
          python -m py_compile \
            rocksoul/tool_parser.py \
            runtime/cpu/benchmark.py \
            runtime/cpu/context_benchmark.py \
            runtime/cpu/system_info.py \
            runtime/cpu/serve.py \
            runtime/cpu/smoke_api.py \
            phase1/prepare_iden.py \
            phase1/download_base.py \
            phase1/eval_iden.py
      - name: Validate shell launchers
        run: |
          bash -n runtime/cpu/run_phase0.sh
          bash -n runtime/cpu/bootstrap_phase0.sh
          bash -n phase1/train_iden.sh
      - name: Validate Kaggle notebook JSON
        run: python -m json.tool notebooks/kaggle_phase1_iden.ipynb >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate CPU compose
        run: docker compose -f deployment/cpu/docker-compose.yml config -q
