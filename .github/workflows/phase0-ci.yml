name: phase0-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile RockSoul CPU runtime
        run: |
          python -m py_compile \
            rocksoul/tool_parser.py \
            runtime/cpu/benchmark.py \
            runtime/cpu/context_benchmark.py \
            runtime/cpu/system_info.py \
            runtime/cpu/serve.py \
            runtime/cpu/smoke_api.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate CPU compose
        run: docker compose -f deployment/cpu/docker-compose.yml config -q
